spring:
  application:
    name: bookstore

  # PostgreSQL is the real application database (development and demo).
  # Override with environment variables; the defaults match a local PostgreSQL install.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bookstore}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only verifies that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    time-zone: UTC
    deserialization:
      # Without this Jackson silently turns 1.5 into 1 for integer fields such as stockQty
      accept-float-as-int: false
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  servlet:
    # Matches `servers[0].url` (http://localhost:8080/api/v1) in openapi.yaml
    context-path: /api/v1

# Business rules (see "Configurable business rules" in openapi.yaml)
bookstore:
  points:
    earn-points-per-unit: 1        # points earned ...
    earn-spend-unit: 10.00         # ... per this many INR spent
    point-value: 1.00              # INR discount per redeemed point
    max-redemption-percent: 50     # % of subtotal; must be 0-50 so an order total is never zero
  order:
    cancellation-window-hours: 48
  delivery:
    transit-days: 3
  cart:
    max-quantity-per-item: 10
  payment:
    # Simulated gateway only: a card number ending with this suffix is declined.
    decline-card-suffix: "0002"
  security:
    jwt:
      # DEV ONLY default. Set JWT_SECRET (at least 32 characters) outside local development.
      secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
      expiry-seconds: 3600

# Request/response bodies are never logged, so card numbers and CVV cannot reach the logs.
logging:
  level:
    root: INFO
    com.capstone.bookstore: INFO
